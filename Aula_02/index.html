<!DOCTYPE html>
<html lang="pt-br">
<head>

    <link rel="shortcut icon" href="favicon-32x32.png" type="image/x-icon">

<body>

    <h1>Desafio das imagens - Cidade Natal</h1>
    <hr>
    <h2>Araçatuba/SP</h2>
    <img src="FOTO ARAÇATUBA.jpg" alt="Cidade de Araçatuba">

    <picture>
        <img src="FOTO ARAÇATUBA.jpg" alt="Foto Araçatuba" width="300px">

    <picture>

    <picture>
        <source media="(max-width: 500px )"  srcset="imagem_p.webp" width="500px">

    </picture>
